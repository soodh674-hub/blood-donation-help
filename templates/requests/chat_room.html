{% extends 'base.html' %}
{% load static %}

{% block title %}Chat - Blood Request #{{ request_id }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-red-900/10 to-gray-900 py-8">
    <div class="max-w-4xl mx-auto px-4">
        
        <!-- Header -->
        <div class="bg-white/5 backdrop-blur-lg rounded-2xl p-6 border border-white/10 mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">
                💬 Chat - Blood Request #{{ request_id }}
            </h1>
            <p class="text-gray-400">Communicate with donor/requester</p>
        </div>
        
        <!-- Chat Container -->
        <div class="bg-white/5 backdrop-blur-lg rounded-2xl border border-white/10 overflow-hidden">
            
            <!-- Messages Area -->
            <div id="chat-messages" class="h-96 overflow-y-auto p-6 space-y-4">
                <!-- Messages loaded dynamically -->
            </div>
            
            <!-- Input Area -->
            <div class="border-t border-white/10 p-4">
                <form id="chat-form" class="flex gap-3">
                    {% csrf_token %}
                    <input type="text" 
                           id="message-input" 
                           placeholder="Type your message..."
                           class="flex-1 bg-gray-800 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500"
                           autocomplete="off">
                    <button type="submit" 
                            class="bg-red-500 hover:bg-red-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors">
                        Send
                    </button>
                </form>
            </div>
        </div>
        
    </div>
</div>

<script>
    // Pass Django context to JavaScript
    window.chatReceiverId = {{ receiver_id|default:"null"|safe }};
    window.chatUserId = {{ user.id|default:"null"|safe }};
    
    // Ensure values are properly typed
    if (typeof window.chatReceiverId === 'string' && window.chatReceiverId !== 'null') {
        window.chatReceiverId = parseInt(window.chatReceiverId) || window.chatReceiverId;
    }
    if (typeof window.chatUserId === 'string' && window.chatUserId !== 'null') {
        window.chatUserId = parseInt(window.chatUserId) || window.chatUserId;
    }
</script>
<script src="{% static 'js/chat-websocket.js' %}"></script>
{% endblock %}
