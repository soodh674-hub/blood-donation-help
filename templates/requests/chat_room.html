{% extends 'base.html' %}
{% load static %}

{% block title %}Chat - Blood Request #{{ request_id }}{% endblock %}

{% block content %}
<div class="py-5" style="min-height: calc(100vh - 76px); background: linear-gradient(135deg, var(--bg-primary) 0%, rgba(239, 68, 68, 0.05) 50%, var(--bg-primary) 100%);" data-aos="fade-in" data-aos-duration="800">
    <div class="container" style="max-width: 900px;">
        
        <!-- Header -->
        <div class="glass-card p-4 mb-4" data-aos="fade-down" data-aos-delay="100">
            <h1 class="display-6 fw-bold text-white mb-2">
                💬 Chat - Blood Request #{{ request_id }}
            </h1>
            <p style="color: var(--text-secondary);">Communicate with donor/requester</p>
        </div>
        
        <!-- Chat Container -->
        <div class="glass-card overflow-hidden" data-aos="zoom-in" data-aos-delay="200">
            
            <!-- Messages Area -->
            <div id="chat-messages" style="height: 400px; overflow-y: auto;" class="p-4">
                <!-- Messages loaded dynamically -->
            </div>
            
            <!-- Input Area -->
            <div class="border-top border-white/10 p-4" style="border-color: rgba(255, 255, 255, 0.1) !important;">
                <form id="chat-form" class="d-flex gap-3">
                    {% csrf_token %}
                    <input type="text" 
                           id="message-input" 
                           placeholder="Type your message..."
                           class="form-control flex-grow-1 bg-white/10 border-white/20 text-white placeholder-secondary"
                           autocomplete="off">
                    <button type="submit" 
                            class="btn btn-gradient px-4 py-2">
                        Send
                    </button>
                </form>
            </div>
        </div>
        
    </div>
</div>

<script>
    // Pass Django context to JavaScript
    window.chatReceiverId = {{ receiver_id|default:"null"|safe }};
    window.chatUserId = {{ user.id|default:"null"|safe }};
    
    // Ensure values are properly typed
    if (typeof window.chatReceiverId === 'string' && window.chatReceiverId !== 'null') {
        window.chatReceiverId = parseInt(window.chatReceiverId) || window.chatReceiverId;
    }
    if (typeof window.chatUserId === 'string' && window.chatUserId !== 'null') {
        window.chatUserId = parseInt(window.chatUserId) || window.chatUserId;
    }
    
    // Initialize AOS
    if (typeof AOS !== 'undefined') {
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true
        });
    }
</script>
<script src="{% static 'js/chat-websocket.js' %}"></script>
{% endblock %}
