{% extends 'base.html' %}
{% load static %}

{% block title %}Create Campaign - BloodLife{% endblock %}

{% block extra_css %}
<style>
    .campaign-create-hero {
        background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%);
        padding: 2rem 0;
        margin-bottom: 2rem;
        color: white;
    }
    
    .form-card {
        background: white;
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}

{% block content %}
<div class="campaign-create-hero">
    <div class="container">
        <h1 class="display-5 fw-bold mb-2">
            <i class="bi bi-plus-circle me-2"></i>
            Create Blood Donation Campaign
        </h1>
        <p class="lead mb-0">Organize a blood donation drive and save lives</p>
    </div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="form-card">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Campaign Name *</label>
                        <input type="text" class="form-control" name="name" required placeholder="e.g., Summer Blood Drive 2024">
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" name="description" rows="3" placeholder="Describe your campaign purpose and goals"></textarea>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Venue *</label>
                            <input type="text" class="form-control" name="venue" required placeholder="e.g., City Hospital Auditorium">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">City *</label>
                            <input type="text" class="form-control" name="city" required placeholder="e.g., Delhi">
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Address *</label>
                        <textarea class="form-control" name="address" rows="2" required placeholder="Full address of the venue"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">State *</label>
                        <input type="text" class="form-control" name="state" required placeholder="e.g., Delhi">
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Start Date & Time *</label>
                            <input type="datetime-local" class="form-control" name="start_date" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">End Date & Time *</label>
                            <input type="datetime-local" class="form-control" name="end_date" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Target Units *</label>
                            <input type="number" class="form-control" name="target_units" value="100" required min="1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Contact Number *</label>
                            <input type="tel" class="form-control" name="contact_number" required placeholder="+91XXXXXXXXXX">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Contact Email *</label>
                        <input type="email" class="form-control" name="contact_email" required placeholder="organizer@hospital.com">
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                            <i class="bi bi-check-circle me-2"></i>
                            Create Campaign
                        </button>
                        <a href="/campaigns/" class="btn btn-outline-secondary btn-lg">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
