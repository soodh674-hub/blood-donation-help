<!-- 
    Chat Widget Component
    Usage: {% include 'components/chat_widget.html' with request_id=request.id %}
    Provides real-time chat via WebSocket with HTTP fallback
-->
<div id="chat-widget" class="position-fixed bottom-0 end-0 m-3 m-sm-4 z-40 d-none" 
     x-data="chatWidget({{ request_id|default:'null' }}, {{ user.id|default:0 }})">
    <!-- Chat Toggle Button -->
    <button @click="toggleChat()" 
            class="btn btn-gradient rounded-circle d-flex align-items-center justify-content-center shadow-lg transition-all duration-300 hover:scale-110 focus:outline-none focus:ring-4 focus:ring-blue-500/50 position-relative" 
            style="width: 56px; height: 56px; background: linear-gradient(135deg, #3b82f6, #2563eb);"
            data-aos="zoom-in"
            data-aos-duration="600">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <span x-show="unreadCount > 0" 
              class="position-absolute top-0 end-0 bg-danger text-white small fw-bold rounded-circle d-flex align-items-center justify-content-center animate-pulse" 
              style="width: 20px; height: 20px; transform: translate(25%, -25%);"
              x-text="unreadCount"></span>
    </button>
    
    <!-- Chat Window -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-90 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-90 translate-y-4"
         class="position-absolute bottom-100 end-0 mb-2 w-100" 
         style="max-width: 384px; background: #111827; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow: hidden;"
         @click.away="isOpen = false"
         data-aos="fade-up"
         data-aos-duration="600">
        
        <!-- Header -->
        <div class="p-3 p-sm-4 d-flex align-items-center justify-content-between" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
            <div class="d-flex align-items-center gap-2">
                <div class="position-relative">
                    <div class="bg-success rounded-circle animate-pulse" style="width: 8px; height: 8px;"></div>
                </div>
                <h3 class="text-white fw-semibold fs-6 mb-0">Live Chat</h3>
            </div>
            <button @click="isOpen = false" class="text-white hover:text-gray-200 btn btn-link text-white p-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Connection Status -->
        <div x-show="connectionStatus !== 'connected'" 
             class="px-3 px-sm-4 py-2 bg-yellow-500/20 border-bottom border-yellow-500/30">
            <p class="text-yellow-300 small d-flex align-items-center gap-2 mb-0">
                <svg class="w-4 h-4" style="animation: spin 1s linear infinite;" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="connectionStatus === 'connecting' ? 'Connecting...' : 'Using HTTP mode'"></span>
            </p>
        </div>
        
        <!-- Messages Container -->
        <div id="chat-messages" class="overflow-y-auto p-3 p-sm-4 bg-gray-800 scroll-smooth" style="height: 320px; max-height: 50vh;">
            <!-- Loading State -->
            <div x-show="loading" class="d-flex align-items-center justify-content-center h-100">
                <div class="text-center">
                    <div class="spinner-border text-primary mx-auto mb-2" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="text-gray-400 small">Loading messages...</p>
                </div>
            </div>
            
            <!-- No Messages -->
            <div x-show="!loading && messages.length === 0" class="d-flex align-items-center justify-content-center h-100">
                <p class="text-gray-500 small">No messages yet. Start the conversation!</p>
            </div>
            
            <!-- Message List -->
            <template x-for="msg in messages" :key="msg.id || msg.timestamp">
                <div :class="msg.is_mine || msg.sender_id === userId ? 'text-end' : 'text-start'"
                     class="mb-3 animate-fade-in">
                    <div :class="msg.is_mine || msg.sender_id === userId ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-200'"
                         class="d-inline-block px-3 px-sm-4 py-2 rounded-3 shadow" style="max-width: 80%;">
                        <p x-text="msg.message" class="small leading-relaxed mb-1"></p>
                        <div class="d-flex align-items-center justify-content-end gap-2">
                            <span class="small opacity-75" x-text="formatTime(msg.timestamp)"></span>
                            <svg x-show="msg.is_mine || msg.sender_id === userId" 
                                 :class="msg.is_read ? 'text-blue-200' : 'text-white/50'"
                                 class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        
        <!-- Input Area -->
        <div class="p-3 p-sm-4 bg-gray-900 border-top border-white/10">
            <form @submit.prevent="sendMessage" class="d-flex gap-2">
                <input type="text" 
                       x-model="newMessage" 
                       @keydown.enter="sendMessage"
                       placeholder="Type a message..." 
                       class="form-control flex-grow-1 bg-gray-800 border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent small">
                <button type="submit" 
                        :disabled="!newMessage.trim() || sending"
                        class="btn btn-gradient px-3 px-sm-4 py-2 disabled:bg-gray-600 disabled:cursor-not-allowed text-white rounded-3 d-flex align-items-center justify-content-center" 
                        style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
                    <svg x-show="!sending" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    <svg x-show="sending" class="w-5 h-5" style="animation: spin 1s linear infinite;" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Initialize AOS
document.addEventListener('DOMContentLoaded', function() {
    if (typeof AOS !== 'undefined') {
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true
        });
    }
});

function chatWidget(requestId, userId) {
    return {
        isOpen: false,
        loading: true,
        sending: false,
        messages: [],
        newMessage: '',
        unreadCount: 0,
        userId: userId || 0,
        requestId: requestId,
        ws: null,
        connectionStatus: 'disconnected', // disconnected, connecting, connected, http-fallback
        
        init() {
            // Auto-load messages when component initializes
            if (this.requestId) {
                this.loadMessages();
            }
        },
        
        toggleChat() {
            this.isOpen = !this.isOpen;
            if (this.isOpen && !this.ws && this.connectionStatus === 'disconnected') {
                this.connectWebSocket();
            }
        },
        
        async loadMessages() {
            if (!this.requestId) return;
            
            this.loading = true;
            try {
                const response = await fetch(`/requests/${this.requestId}/chat/`);
                const data = await response.json();
                
                if (data.success) {
                    this.messages = data.messages.map(msg => ({
                        ...msg,
                        is_mine: msg.sender === this.userId
                    }));
                    this.scrollToBottom();
                }
            } catch (error) {
                console.error('Failed to load messages:', error);
            } finally {
                this.loading = false;
            }
        },
        
        connectWebSocket() {
            if (!this.requestId) return;
            
            this.connectionStatus = 'connecting';
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat/${this.requestId}/`;
            
            this.ws = new WebSocket(wsUrl);
            
            this.ws.onopen = () => {
                console.log('✅ WebSocket connected');
                this.connectionStatus = 'connected';
            };
            
            this.ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'chat') {
                    this.messages.push({
                        id: Date.now(),
                        message: data.message,
                        sender_id: data.sender_id,
                        sender_name: data.sender_name,
                        timestamp: new Date().toISOString(),
                        is_mine: data.is_mine,
                        is_read: false
                    });
                    this.scrollToBottom();
                    
                    // Increment unread count if not my message and chat is closed
                    if (!data.is_mine && !this.isOpen) {
                        this.unreadCount++;
                    }
                }
            };
            
            this.ws.onerror = (error) => {
                console.error('❌ WebSocket error, falling back to HTTP polling');
                this.connectionStatus = 'http-fallback';
                this.startHttpPolling();
            };
            
            this.ws.onclose = () => {
                console.log('WebSocket disconnected');
                this.connectionStatus = 'disconnected';
                // Attempt reconnection after 3 seconds
                setTimeout(() => {
                    if (this.isOpen) {
                        this.connectWebSocket();
                    }
                }, 3000);
            };
        },
        
        startHttpPolling() {
            // Poll for new messages every 3 seconds
            setInterval(async () => {
                if (this.isOpen) {
                    await this.loadMessages();
                }
            }, 3000);
        },
        
        async sendMessage() {
            if (!this.newMessage.trim() || this.sending) return;
            
            this.sending = true;
            const messageText = this.newMessage.trim();
            
            try {
                // Try WebSocket first
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        message: messageText,
                        receiver_id: null  // Will default to requester
                    }));
                    
                    // Optimistically add to UI
                    this.messages.push({
                        id: Date.now(),
                        message: messageText,
                        sender_id: this.userId,
                        timestamp: new Date().toISOString(),
                        is_mine: true,
                        is_read: false
                    });
                    this.scrollToBottom();
                } else {
                    // Fallback to HTTP
                    const response = await fetch(`/requests/${this.requestId}/chat/send/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({ 
                            message: messageText,
                            receiver_id: null
                        })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        this.messages.push({
                            ...data.message,
                            is_mine: true
                        });
                        this.scrollToBottom();
                    } else {
                        console.error('Failed to send message:', data.error);
                        alert('Failed to send message');
                    }
                }
                
                this.newMessage = '';
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Error sending message');
            } finally {
                this.sending = false;
            }
        },
        
        scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById('chat-messages');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, 100);
        },
        
        formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    }
}

// Helper function to get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>

<style>
@keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fade-in 0.3s ease-out;
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
