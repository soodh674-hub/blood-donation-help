<!-- 
    Chat Widget Component
    Usage: {% include 'components/chat_widget.html' with request_id=request.id %}
    Provides real-time chat via WebSocket with HTTP fallback
-->
<div id="chat-widget" class="fixed bottom-24 right-6 z-40 hidden" 
     x-data="chatWidget({{ request_id|default:'null' }}, {{ user.id|default:0 }})">
    <!-- Chat Toggle Button -->
    <button @click="toggleChat()" 
            class="w-14 h-14 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white rounded-full shadow-2xl flex items-center justify-center transition-all duration-300 transform hover:scale-110 focus:outline-none focus:ring-4 focus:ring-blue-500/50">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <span x-show="unreadCount > 0" 
              class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center animate-pulse" 
              x-text="unreadCount"></span>
    </button>
    
    <!-- Chat Window -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-90 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-90 translate-y-4"
         class="absolute bottom-16 right-0 w-80 md:w-96 bg-gray-900 border border-white/20 rounded-2xl shadow-2xl overflow-hidden"
         @click.away="isOpen = false">
        
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-500 to-blue-600 p-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="relative">
                    <div class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                </div>
                <h3 class="text-white font-semibold">Live Chat</h3>
            </div>
            <button @click="isOpen = false" class="text-white hover:text-gray-200 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        
        <!-- Connection Status -->
        <div x-show="connectionStatus !== 'connected'" 
             class="px-4 py-2 bg-yellow-500/20 border-b border-yellow-500/30">
            <p class="text-yellow-300 text-xs flex items-center gap-2">
                <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="connectionStatus === 'connecting' ? 'Connecting...' : 'Using HTTP mode'"></span>
            </p>
        </div>
        
        <!-- Messages Container -->
        <div id="chat-messages" class="h-80 overflow-y-auto p-4 space-y-3 bg-gray-800 scroll-smooth">
            <!-- Loading State -->
            <div x-show="loading" class="flex items-center justify-center h-full">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-2 border-blue-500 border-t-transparent mx-auto mb-2"></div>
                    <p class="text-gray-400 text-sm">Loading messages...</p>
                </div>
            </div>
            
            <!-- No Messages -->
            <div x-show="!loading && messages.length === 0" class="flex items-center justify-center h-full">
                <p class="text-gray-500 text-sm">No messages yet. Start the conversation!</p>
            </div>
            
            <!-- Message List -->
            <template x-for="msg in messages" :key="msg.id || msg.timestamp">
                <div :class="msg.is_mine || msg.sender_id === userId ? 'text-right' : 'text-left'"
                     class="animate-fade-in">
                    <div :class="msg.is_mine || msg.sender_id === userId ? 'bg-blue-500 text-white' : 'bg-gray-700 text-gray-200'"
                         class="inline-block px-4 py-2 rounded-lg max-w-[80%] shadow-md">
                        <p x-text="msg.message" class="text-sm leading-relaxed"></p>
                        <div class="flex items-center justify-end gap-2 mt-1">
                            <span class="text-xs opacity-75" x-text="formatTime(msg.timestamp)"></span>
                            <svg x-show="msg.is_mine || msg.sender_id === userId" 
                                 :class="msg.is_read ? 'text-blue-200' : 'text-white/50'"
                                 class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </template>
        </div>
        
        <!-- Input Area -->
        <div class="p-4 bg-gray-900 border-t border-white/10">
            <form @submit.prevent="sendMessage" class="flex gap-2">
                <input type="text" 
                       x-model="newMessage" 
                       @keydown.enter="sendMessage"
                       placeholder="Type a message..." 
                       class="flex-1 px-3 py-2 bg-gray-800 border border-white/20 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                <button type="submit" 
                        :disabled="!newMessage.trim() || sending"
                        class="px-4 py-2 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-600 disabled:cursor-not-allowed text-white rounded-lg transition-colors flex items-center justify-center">
                    <svg x-show="!sending" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                    <svg x-show="sending" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
function chatWidget(requestId, userId) {
    return {
        isOpen: false,
        loading: true,
        sending: false,
        messages: [],
        newMessage: '',
        unreadCount: 0,
        userId: userId || 0,
        requestId: requestId,
        ws: null,
        connectionStatus: 'disconnected', // disconnected, connecting, connected, http-fallback
        
        init() {
            // Auto-load messages when component initializes
            if (this.requestId) {
                this.loadMessages();
            }
        },
        
        toggleChat() {
            this.isOpen = !this.isOpen;
            if (this.isOpen && !this.ws && this.connectionStatus === 'disconnected') {
                this.connectWebSocket();
            }
        },
        
        async loadMessages() {
            if (!this.requestId) return;
            
            this.loading = true;
            try {
                const response = await fetch(`/requests/${this.requestId}/chat/`);
                const data = await response.json();
                
                if (data.success) {
                    this.messages = data.messages.map(msg => ({
                        ...msg,
                        is_mine: msg.sender === this.userId
                    }));
                    this.scrollToBottom();
                }
            } catch (error) {
                console.error('Failed to load messages:', error);
            } finally {
                this.loading = false;
            }
        },
        
        connectWebSocket() {
            if (!this.requestId) return;
            
            this.connectionStatus = 'connecting';
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat/${this.requestId}/`;
            
            this.ws = new WebSocket(wsUrl);
            
            this.ws.onopen = () => {
                console.log('✅ WebSocket connected');
                this.connectionStatus = 'connected';
            };
            
            this.ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'chat') {
                    this.messages.push({
                        id: Date.now(),
                        message: data.message,
                        sender_id: data.sender_id,
                        sender_name: data.sender_name,
                        timestamp: new Date().toISOString(),
                        is_mine: data.is_mine,
                        is_read: false
                    });
                    this.scrollToBottom();
                    
                    // Increment unread count if not my message and chat is closed
                    if (!data.is_mine && !this.isOpen) {
                        this.unreadCount++;
                    }
                }
            };
            
            this.ws.onerror = (error) => {
                console.error('❌ WebSocket error, falling back to HTTP polling');
                this.connectionStatus = 'http-fallback';
                this.startHttpPolling();
            };
            
            this.ws.onclose = () => {
                console.log('WebSocket disconnected');
                this.connectionStatus = 'disconnected';
                // Attempt reconnection after 3 seconds
                setTimeout(() => {
                    if (this.isOpen) {
                        this.connectWebSocket();
                    }
                }, 3000);
            };
        },
        
        startHttpPolling() {
            // Poll for new messages every 3 seconds
            setInterval(async () => {
                if (this.isOpen) {
                    await this.loadMessages();
                }
            }, 3000);
        },
        
        async sendMessage() {
            if (!this.newMessage.trim() || this.sending) return;
            
            this.sending = true;
            const messageText = this.newMessage.trim();
            
            try {
                // Try WebSocket first
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({
                        message: messageText,
                        receiver_id: null  // Will default to requester
                    }));
                    
                    // Optimistically add to UI
                    this.messages.push({
                        id: Date.now(),
                        message: messageText,
                        sender_id: this.userId,
                        timestamp: new Date().toISOString(),
                        is_mine: true,
                        is_read: false
                    });
                    this.scrollToBottom();
                } else {
                    // Fallback to HTTP
                    const response = await fetch(`/requests/${this.requestId}/chat/send/`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        body: JSON.stringify({ 
                            message: messageText,
                            receiver_id: null
                        })
                    });
                    
                    const data = await response.json();
                    if (data.success) {
                        this.messages.push({
                            ...data.message,
                            is_mine: true
                        });
                        this.scrollToBottom();
                    } else {
                        console.error('Failed to send message:', data.error);
                        alert('Failed to send message');
                    }
                }
                
                this.newMessage = '';
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Error sending message');
            } finally {
                this.sending = false;
            }
        },
        
        scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById('chat-messages');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, 100);
        },
        
        formatTime(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    }
}

// Helper function to get CSRF token
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>

<style>
@keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fade-in 0.3s ease-out;
}
</style>
