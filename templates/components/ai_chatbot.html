<!-- 
    AI Chatbot Assistant Component
    Provides intelligent assistance for blood donation queries
    Includes predefined responses + can be extended with AI API
    Only visible on desktop/tablet devices (>= 768px)
-->
<div id="ai-chatbot" class="position-fixed bottom-0 start-0 m-3 m-sm-4 z-50 d-none d-md-block" x-data="aiChatbot()">
    <!-- Chatbot Toggle Button -->
    <button @click="toggleChatbot()" 
            class="btn btn-gradient rounded-circle d-flex align-items-center justify-content-center shadow-lg transition-all duration-300 hover:scale-110 focus:outline-none focus:ring-4 focus:ring-purple-500/50 position-relative" 
            style="width: 56px; height: 56px; background: linear-gradient(135deg, #8b5cf6, #7c3aed);"
            data-aos="zoom-in"
            data-aos-duration="600">
        <svg x-show="!isOpen" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <svg x-show="isOpen" class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
        
        <!-- Notification Badge -->
        <span x-show="hasNewMessage && !isOpen" 
              class="position-absolute top-0 end-0 bg-danger text-white small fw-bold rounded-circle d-flex align-items-center justify-content-center" 
              style="width: 20px; height: 20px; transform: translate(25%, -25%); animation: bounce 1s infinite;">
            !
        </span>
    </button>
    
    <!-- Chatbot Window -->
    <div x-show="isOpen" 
         x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-90 translate-y-4"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100 translate-y-0"
         x-transition:leave-end="opacity-0 scale-90 translate-y-4"
         class="position-absolute bottom-100 start-0 mb-2 chatbot-window"
         style="background: #111827; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow: hidden;"
         @click.away="isOpen = false"
         data-aos="fade-up"
         data-aos-duration="600">
        
        <!-- Header -->
        <div class="p-3 p-sm-4" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">
            <div class="d-flex align-items-center gap-3">
                <div class="position-relative">
                    <div class="d-flex align-items-center justify-content-center rounded-circle bg-white/20" style="width: 40px; height: 40px;">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="position-absolute bottom-0 end-0 bg-success rounded-circle" style="width: 12px; height: 12px; border: 2px solid #7c3aed;"></div>
                </div>
                <div class="flex-grow-1">
                    <h3 class="text-white fw-semibold fs-6 mb-0">BloodBot Assistant</h3>
                    <p class="text-white-80 small mb-0">Always here to help 🩸</p>
                </div>
                <button @click="resetChat()" class="text-white-70 hover:text-white btn btn-link text-white-70 p-0" title="Reset conversation">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="p-3 bg-gray-800 border-bottom border-white/10">
            <p class="text-gray-400 small mb-2">Quick Questions:</p>
            <div class="d-flex flex-wrap gap-2">
                <button @click="sendQuickMessage('How can I donate blood?')" 
                        class="btn btn-sm btn-outline-light bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 rounded-3">
                    How to donate?
                </button>
                <button @click="sendQuickMessage('What are the eligibility criteria?')" 
                        class="btn btn-sm btn-outline-light bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 rounded-3">
                    Eligibility?
                </button>
                <button @click="sendQuickMessage('Find blood donors near me')" 
                        class="btn btn-sm btn-outline-light bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 rounded-3">
                    Find donors
                </button>
                <button @click="sendQuickMessage('Create a blood request')" 
                        class="btn btn-sm btn-outline-light bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 rounded-3">
                    Create request
                </button>
            </div>
        </div>
        
        <!-- Messages Container -->
        <div id="chatbot-messages" class="overflow-y-auto p-3 p-sm-4 bg-gray-800 scroll-smooth" style="height: 320px; max-height: 50vh;">
            <!-- Welcome Message -->
            <div x-show="messages.length === 0" class="text-center py-4 py-sm-5">
                <div class="d-flex align-items-center justify-content-center mx-auto mb-3 rounded-circle bg-purple-500/20" style="width: 64px; height: 64px;">
                    <svg class="w-8 h-8 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <p class="text-white fw-semibold mb-1">Hello! 👋</p>
                <p class="text-gray-400 small">I'm your BloodBot assistant. Ask me anything about blood donation!</p>
            </div>
            
            <!-- Message List -->
            <template x-for="(msg, index) in messages" :key="index">
                <div :class="msg.type === 'user' ? 'text-end' : 'text-start'"
                     class="mb-3 animate-fade-in">
                    <div :class="msg.type === 'user' ? 'bg-purple-500 text-white' : 'bg-gray-700 text-gray-200'"
                         class="d-inline-block px-3 px-sm-4 py-2 rounded-3 shadow" style="max-width: 85%;">
                        <p x-html="msg.text" class="small leading-relaxed mb-1"></p>
                        <span class="small opacity-75 d-block" x-text="formatTime(msg.timestamp)"></span>
                    </div>
                </div>
            </template>
            
            <!-- Typing Indicator -->
            <div x-show="isTyping" class="text-start mb-3">
                <div class="bg-gray-700 text-gray-200 d-inline-block px-3 px-sm-4 py-2 py-sm-3 rounded-3">
                    <div class="d-flex gap-1">
                        <div class="bg-gray-400 rounded-circle" style="width: 8px; height: 8px; animation: bounce 1s infinite; animation-delay: 0s"></div>
                        <div class="bg-gray-400 rounded-circle" style="width: 8px; height: 8px; animation: bounce 1s infinite; animation-delay: 0.2s"></div>
                        <div class="bg-gray-400 rounded-circle" style="width: 8px; height: 8px; animation: bounce 1s infinite; animation-delay: 0.4s"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Input Area -->
        <div class="p-3 p-sm-4 bg-gray-900 border-top border-white/10">
            <form @submit.prevent="sendMessage" class="d-flex gap-2">
                <input type="text" 
                       x-model="userInput" 
                       @keydown.enter="sendMessage"
                       placeholder="Ask me anything..." 
                       class="form-control flex-grow-1 bg-gray-800 border-white/20 text-white placeholder-gray-500 focus:ring-2 focus:ring-purple-500 focus:border-transparent small">
                <button type="submit" 
                        :disabled="!userInput.trim() || isTyping"
                        class="btn btn-gradient px-3 px-sm-4 py-2 disabled:bg-gray-600 disabled:cursor-not-allowed text-white rounded-3" 
                        style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
// Initialize AOS
document.addEventListener('DOMContentLoaded', function() {
    if (typeof AOS !== 'undefined') {
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true
        });
    }
});

function aiChatbot() {
    return {
        isOpen: false,
        isTyping: false,
        userInput: '',
        messages: [],
        hasNewMessage: false,
        sessionId: null,
        
        // Knowledge base for common questions
        knowledgeBase: {
            'donate': {
                keywords: ['donate', 'donation', 'how to donate', 'donate blood'],
                response: `To donate blood:<br><br>
                    1️⃣ <b>Register</b> - Create an account on BloodLife<br>
                    2️⃣ <b>Check Eligibility</b> - Age 18-65, weight >50kg, healthy<br>
                    3️⃣ <b>Find Centers</b> - Use our locator to find nearby centers<br>
                    4️⃣ <b>Schedule</b> - Book an appointment<br>
                    5️⃣ <b>Donate</b> - Takes only 10-15 minutes!<br><br>
                    💡 You can donate every 3 months (males) or 4 months (females)`
            },
            'eligibility': {
                keywords: ['eligibility', 'eligible', 'criteria', 'requirements', 'who can donate'],
                response: `<b>Blood Donation Eligibility:</b><br><br>
                    ✅ Age: 18-65 years<br>
                    ✅ Weight: Above 50 kg<br>
                    ✅ Hemoglobin: 12.5 g/dL minimum<br>
                    ✅ Healthy & feeling well<br>
                    ✅ No recent infections<br><br>
                    ❌ Not eligible if:<br>
                    • Pregnant or breastfeeding<br>
                    • Recent tattoo/piercing (6 months)<br>
                    • Certain medical conditions<br>
                    • Recent surgery<br><br>
                    🏥 Final eligibility determined at donation center`
            },
            'find': {
                keywords: ['find', 'search', 'near me', 'locate', 'donors near'],
                response: `To find blood donors or centers:<br><br>
                    🔍 <b>Search Donors:</b><br>
                    • Go to "Find Donor" page<br>
                    • Select blood group needed<br>
                    • Enter your location/pincode<br>
                    • View available donors nearby<br><br>
                    🏥 <b>Find Blood Banks:</b><br>
                    • Check our directory<br>
                    • Filter by location<br>
                    • See contact details & hours<br><br>
                    📱 Or use the search bar on homepage!`
            },
            'request': {
                keywords: ['request', 'create request', 'need blood', 'blood request'],
                response: `To create a blood request:<br><br>
                    1️⃣ Click "Create Request" button<br>
                    2️⃣ Fill patient details:<br>
                    • Name, age, blood group<br>
                    • Units required<br>
                    • Hospital/location<br>
                    • Urgency level<br>
                    3️⃣ Submit request<br>
                    4️⃣ Compatible donors notified instantly!<br><br>
                    ⚡ Emergency requests get priority notification<br>
                    📊 Track request status in real-time`
            },
            'safety': {
                keywords: ['safe', 'safety', 'risk', 'dangerous', 'side effects'],
                response: `<b>Blood donation is VERY safe!</b><br><br>
                    ✅ Sterile, single-use needles<br>
                    ✅ Trained medical staff<br>
                    ✅ Health screening before donation<br>
                    ✅ Refreshments provided after<br><br>
                    <b>Common concerns:</b><br>
                    • Minimal discomfort (small needle prick)<br>
                    • Body replaces plasma in 24-48 hours<br>
                    • Red blood cells in 4-6 weeks<br>
                    • Very low risk of complications<br><br>
                    💪 Millions donate safely every year!`
            },
            'units': {
                keywords: ['units', 'how much', 'quantity', 'volume'],
                response: `<b>About Blood Units:</b><br><br>
                    🩸 One unit = ~450-500 ml<br>
                    ⏱️ Donation time: 10-15 minutes<br>
                    🔄 Recovery: 24-48 hours for plasma<br><br>
                    <b>Donation frequency:</b><br>
                    • Whole blood: Every 3-4 months<br>
                    • Platelets: Every 7 days (max 24/year)<br>
                    • Plasma: Every 28 days<br><br>
                    💡 Your body constantly produces new blood cells!`
            },
            'help': {
                keywords: ['help', 'support', 'contact', 'assistance'],
                response: `<b>How can I help you?</b><br><br>
                    I can assist with:<br>
                    • 🩸 Donation process & eligibility<br>
                    • 🔍 Finding donors/blood banks<br>
                    • 📝 Creating blood requests<br>
                    • ❓ General blood donation questions<br>
                    • 🚨 Emergency procedures<br><br>
                    For technical support:<br>
                    📧 Email: support@bloodlife.com<br>
                    📞 Phone: +91-XXX-XXX-XXXX<br><br>
                    Just ask your question! 😊`
            }
        },
        
        toggleChatbot() {
            this.isOpen = !this.isOpen;
            if (this.isOpen) {
                this.hasNewMessage = false;
                this.scrollToBottom();
            }
        },
        
        sendQuickMessage(text) {
            this.userInput = text;
            this.sendMessage();
        },
        
        async sendMessage() {
            if (!this.userInput.trim() || this.isTyping) return;

            const userMessage = this.userInput.trim();

            // Add user message
            this.messages.push({
                type: 'user',
                text: userMessage,
                timestamp: new Date()
            });

            this.userInput = '';
            this.scrollToBottom();

            // Show typing indicator
            this.isTyping = true;

            try {
                // Call backend API
                const response = await fetch('/api/requests/chatbot/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCsrfToken()
                    },
                    body: JSON.stringify({
                        message: userMessage,
                        session_id: this.sessionId
                    })
                });

                const data = await response.json();

                if (data.success && data.response) {
                    this.messages.push({
                        type: 'bot',
                        text: data.response,
                        timestamp: new Date()
                    });

                    // Store session ID for conversation continuity
                    if (data.session_id) {
                        this.sessionId = data.session_id;
                    }
                } else {
                    // Fallback to local response if API fails or returns empty
                    console.warn('Chatbot API returned empty or error response, using fallback');
                    const fallbackResponse = this.generateResponse(userMessage);
                    this.messages.push({
                        type: 'bot',
                        text: fallbackResponse,
                        timestamp: new Date()
                    });
                }
            } catch (error) {
                console.error('Chatbot API error:', error);
                // Fallback to local response if API fails
                const fallbackResponse = this.generateResponse(userMessage);
                this.messages.push({
                    type: 'bot',
                    text: fallbackResponse,
                    timestamp: new Date()
                });
            }

            this.isTyping = false;
            this.scrollToBottom();
        },

        getCsrfToken() {
            const csrfCookie = document.cookie.split('; ').find(row => row.startsWith('csrftoken='));
            return csrfCookie ? csrfCookie.split('=')[1] : '';
        },
        
        generateResponse(userMessage) {
            const message = userMessage.toLowerCase();
            
            // Search knowledge base
            for (const key in this.knowledgeBase) {
                const entry = this.knowledgeBase[key];
                if (entry.keywords.some(keyword => message.includes(keyword))) {
                    return entry.response;
                }
            }
            
            // Default responses based on context
            if (message.includes('hello') || message.includes('hi') || message.includes('hey')) {
                return `Hello! 👋 Welcome to BloodLife!<br><br>I'm here to help you with blood donation queries. What would you like to know?`;
            }
            
            if (message.includes('thank')) {
                return `You're welcome! 😊<br><br>Is there anything else I can help you with?`;
            }
            
            if (message.includes('bye') || message.includes('goodbye')) {
                return `Goodbye! Take care! 👋<br><br>Remember, donating blood saves lives! ❤️`;
            }
            
            // Fallback response
            return `I appreciate your question! 🤔<br><br>
                While I'm still learning, I can help you with:<br>
                • Blood donation process<br>
                • Eligibility criteria<br>
                • Finding donors<br>
                • Creating requests<br>
                • Safety information<br><br>
                Try asking about these topics, or contact our support team for detailed assistance! 📧`;
        },
        
        resetChat() {
            if (confirm('Start a new conversation?')) {
                this.messages = [];
                this.hasNewMessage = false;
            }
        },
        
        scrollToBottom() {
            setTimeout(() => {
                const container = document.getElementById('chatbot-messages');
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, 100);
        },
        
        formatTime(timestamp) {
            return timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
    }
}
</script>

<style>
@keyframes fade-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {
    animation: fade-in 0.3s ease-out;
}
@keyframes bounce {
    0%, 100% {
        transform: translateY(-25%);
        animation-timing-function: cubic-bezier(0.8, 0, 1, 1);
    }
    50% {
        transform: translateY(0);
        animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
    }
}

/* Fix positioning on big screens */
#ai-chatbot {
    z-index: 1050 !important;
    bottom: 24px !important;
    left: 24px !important;
}

/* Ensure chatbot window appears above toggle button */
#ai-chatbot .position-absolute {
    z-index: 1060 !important;
}

/* Chatbot window responsive width */
.chatbot-window {
    width: 380px !important;
    max-width: 90vw !important;
}

/* Responsive spacing and sizing for different screen sizes */
@media (min-width: 768px) and (max-width: 1023px) {
    #ai-chatbot {
        bottom: 20px !important;
        left: 20px !important;
    }
    .chatbot-window {
        width: 400px !important;
        max-width: 85vw !important;
    }
}

@media (min-width: 1024px) and (max-width: 1439px) {
    #ai-chatbot {
        bottom: 24px !important;
        left: 24px !important;
    }
    .chatbot-window {
        width: 450px !important;
        max-width: 80vw !important;
    }
}

@media (min-width: 1440px) {
    #ai-chatbot {
        bottom: 32px !important;
        left: 32px !important;
    }
    .chatbot-window {
        width: 500px !important;
        max-width: 75vw !important;
    }
}

/* Extra large screens */
@media (min-width: 1920px) {
    .chatbot-window {
        width: 550px !important;
        max-width: 70vw !important;
    }
}
</style>
