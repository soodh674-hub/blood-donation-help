{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password - BloodLife{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-red-900/10 to-gray-900 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <div class="mx-auto h-16 w-16 bg-gradient-to-r from-red-500 to-red-600 rounded-full flex items-center justify-center mb-4">
                <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-white">
                Reset your password
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Enter your email address and we'll send you a verification code
            </p>
        </div>

        <div class="bg-white/5 backdrop-blur-lg rounded-2xl p-8 border border-white/10 shadow-2xl">
            <form id="forgotPasswordForm" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
                                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
                            </svg>
                        </div>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            required
                            class="block w-full pl-10 pr-3 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-200"
                            placeholder="you@example.com"
                        >
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200 transform hover:scale-105">
                        <span id="buttonText">Send Reset Code</span>
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400">
                    Remember your password? 
                    <a href="{% url 'login-page' %}" class="font-medium text-red-400 hover:text-red-300 transition-colors">
                        Sign in here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const buttonText = document.getElementById('buttonText');
    const originalButtonText = buttonText.textContent;

    // Add input validation
    function validateForm() {
        let isValid = true;
        
        // Clear previous errors
        emailInput.classList.remove('border-red-500');
        
        const email = emailInput.value.trim();
        if (!email) {
            showError('Please enter your email address');
            emailInput.classList.add('border-red-500');
            isValid = false;
        } else if (!isValidEmail(email)) {
            showError('Please enter a valid email address');
            emailInput.classList.add('border-red-500');
            isValid = false;
        }
        
        return isValid;
    }

    function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
    }

    function showError(message) {
        hideAllMessages();
        const errorMsg = document.createElement('div');
        errorMsg.className = 'mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm text-center';
        errorMsg.innerHTML = message;
        errorMsg.id = 'errorMessage';
        form.parentNode.insertBefore(errorMsg, form.nextSibling);
        
        // Auto-remove error after 5 seconds
        setTimeout(() => {
            if (errorMsg.parentNode) {
                errorMsg.remove();
            }
        }, 5000);
    }

    function showSuccess(message) {
        hideAllMessages();
        const successMsg = document.createElement('div');
        successMsg.className = 'mt-4 p-3 bg-green-500/20 border border-green-500/50 rounded-lg text-green-300 text-sm text-center';
        successMsg.innerHTML = message;
        successMsg.id = 'successMessage';
        form.parentNode.insertBefore(successMsg, form.nextSibling);
        
        // Auto-remove success after 5 seconds
        setTimeout(() => {
            if (successMsg.parentNode) {
                successMsg.remove();
            }
        }, 5000);
    }

    function hideAllMessages() {
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        if (errorMsg) errorMsg.remove();
        if (successMsg) successMsg.remove();
    }

    function setButtonLoading(isLoading) {
        const button = form.querySelector('button[type="submit"]');
        if (isLoading) {
            buttonText.textContent = 'Sending...';
            button.disabled = true;
        } else {
            buttonText.textContent = originalButtonText;
            button.disabled = false;
        }
    }

    // Form submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!validateForm()) {
            return;
        }

        setButtonLoading(true);
        
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

        const formData = new FormData();
        formData.append('email', emailInput.value.trim());
        if (csrfToken) {
            formData.append('csrfmiddlewaretoken', csrfToken);
        }

        try {
            const response = await fetch('/accounts/api/forgot-password/', {
                method: 'POST',
                body: formData,
                headers: csrfToken ? { 'X-CSRFToken': csrfToken } : {}
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('OTP sent successfully! Redirecting to verification...');
                // Redirect to OTP verification page after 2 seconds
                setTimeout(() => {
                    window.location.href = `/accounts/verify-otp/?email=${encodeURIComponent(emailInput.value.trim())}`;
                }, 2000);
            } else {
                showError(data.error || 'Failed to send reset code. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            showError('Network error. Please try again.');
        } finally {
            setButtonLoading(false);
        }
    });

    // Real-time validation
    emailInput.addEventListener('input', function() {
        if (this.value.trim() && isValidEmail(this.value.trim())) {
            this.classList.remove('border-red-500');
        }
    });
});
</script>
{% endblock %}
