{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password - BloodLife{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5 px-4" style="min-height: calc(100vh - 76px); background: linear-gradient(135deg, var(--bg-primary) 0%, rgba(239, 68, 68, 0.05) 50%, var(--bg-primary) 100%);" data-aos="fade-up" data-aos-duration="800">
    <div class="w-100" style="max-width: 400px;">
        <div class="text-center mb-4" data-aos="fade-down" data-aos-delay="100">
            <div class="mx-auto d-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, #ef4444, #dc2626);">
                <i class="bi bi-shield-lock text-white fs-4"></i>
            </div>
            <h2 class="display-6 fw-bold text-white mb-2">
                Reset your password
            </h2>
            <p class="small mb-0" style="color: var(--text-secondary);">
                Enter your email address and we'll send you a verification code
            </p>
        </div>

        <div class="glass-card p-4" data-aos="zoom-in" data-aos-delay="200">
            <form id="forgotPasswordForm" class="mb-3">
                {% csrf_token %}
                <div>
                    <label for="email" class="form-label small fw-medium" style="color: var(--text-secondary);">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text" style="background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); color: var(--text-secondary);">
                            <i class="bi bi-envelope"></i>
                        </span>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            required
                            class="form-control"
                            style="background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); color: var(--text-primary);"
                            placeholder="you@example.com"
                        >
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="btn btn-gradient w-100">
                        <span id="buttonText">Send Reset Code</span>
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="small mb-0" style="color: var(--text-secondary);">
                    Remember your password? 
                    <a href="{% url 'accounts:login' %}" class="text-danger fw-medium text-decoration-none hover:opacity-75">
                        Sign in here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('forgotPasswordForm');
    const emailInput = document.getElementById('email');
    const buttonText = document.getElementById('buttonText');
    const originalButtonText = buttonText.textContent;

    // Add input validation
    function validateForm() {
        let isValid = true;
        
        // Clear previous errors
        emailInput.classList.remove('is-invalid', 'border-danger');
        
        const email = emailInput.value.trim();
        if (!email) {
            showError('Please enter your email address');
            emailInput.classList.add('is-invalid');
            isValid = false;
        } else if (!isValidEmail(email)) {
            showError('Please enter a valid email address');
            emailInput.classList.add('is-invalid');
            isValid = false;
        }
        
        return isValid;
    }

    function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
    }

    function showError(message) {
        hideAllMessages();
        const errorMsg = document.createElement('div');
        errorMsg.className = 'mt-3 p-3 alert alert-danger rounded-3 text-center small';
        errorMsg.innerHTML = message;
        errorMsg.id = 'errorMessage';
        form.parentNode.insertBefore(errorMsg, form.nextSibling);
        
        // Auto-remove error after 5 seconds
        setTimeout(() => {
            if (errorMsg.parentNode) {
                errorMsg.remove();
            }
        }, 5000);
    }

    function showSuccess(message) {
        hideAllMessages();
        const successMsg = document.createElement('div');
        successMsg.className = 'mt-3 p-3 alert alert-success rounded-3 text-center small';
        successMsg.innerHTML = message;
        successMsg.id = 'successMessage';
        form.parentNode.insertBefore(successMsg, form.nextSibling);
        
        // Auto-remove success after 5 seconds
        setTimeout(() => {
            if (successMsg.parentNode) {
                successMsg.remove();
            }
        }, 5000);
    }

    function hideAllMessages() {
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        if (errorMsg) errorMsg.remove();
        if (successMsg) successMsg.remove();
    }

    function setButtonLoading(isLoading) {
        const button = form.querySelector('button[type="submit"]');
        if (isLoading) {
            buttonText.textContent = 'Sending...';
            button.disabled = true;
        } else {
            buttonText.textContent = originalButtonText;
            button.disabled = false;
        }
    }

    // Form submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!validateForm()) {
            return;
        }

        setButtonLoading(true);
        
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

        const formData = new FormData();
        formData.append('email', emailInput.value.trim());
        if (csrfToken) {
            formData.append('csrfmiddlewaretoken', csrfToken);
        }

        try {
            const response = await fetch('/accounts/api/forgot-password/', {
                method: 'POST',
                body: formData,
                headers: csrfToken ? { 'X-CSRFToken': csrfToken } : {}
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('OTP sent successfully! Redirecting to verification...');
                // Redirect to OTP verification page after 2 seconds
                setTimeout(() => {
                    window.location.href = `/accounts/verify-otp/?email=${encodeURIComponent(emailInput.value.trim())}`;
                }, 2000);
            } else {
                showError(data.error || 'Failed to send reset code. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            showError('Network error. Please try again.');
        } finally {
            setButtonLoading(false);
        }
    });

    // Real-time validation
    emailInput.addEventListener('input', function() {
        if (this.value.trim() && isValidEmail(this.value.trim())) {
            this.classList.remove('is-invalid');
        }
    });

    // Initialize AOS
    if (typeof AOS !== 'undefined') {
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true
        });
    }
});
</script>
{% endblock %}
