{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - BloodLife{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5 px-4" style="min-height: calc(100vh - 76px); background: linear-gradient(135deg, var(--bg-primary) 0%, rgba(239, 68, 68, 0.05) 50%, var(--bg-primary) 100%);" data-aos="fade-up" data-aos-duration="800">
    <div class="w-100" style="max-width: 400px;">
        <div class="text-center mb-4" data-aos="fade-down" data-aos-delay="100">
            <div class="mx-auto d-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px; background: linear-gradient(135deg, #ef4444, #dc2626);">
                <i class="bi bi-key-fill text-white fs-4"></i>
            </div>
            <h2 class="display-6 fw-bold text-white mb-2">
                Set new password
            </h2>
            <p class="small mb-0" style="color: var(--text-secondary);">
                Create a strong password for your account
            </p>
        </div>

        <div class="glass-card p-4" data-aos="zoom-in" data-aos-delay="200">
            <form id="resetPasswordForm" class="mb-3">
                {% csrf_token %}
                <div>
                    <label for="password" class="form-label text-white small fw-medium">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white/10 border-white/20 text-white">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required
                            class="form-control bg-white/10 border-white/20 text-white placeholder-secondary"
                            placeholder="Enter new password"
                        >
                        <button type="button" id="togglePassword" class="input-group-text bg-white/10 border-white/20 text-white btn btn-link text-decoration-none">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="form-label text-white small fw-medium">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white/10 border-white/20 text-white">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            type="password" 
                            required
                            class="form-control bg-white/10 border-white/20 text-white placeholder-secondary"
                            placeholder="Confirm new password"
                        >
                        <button type="button" id="toggleConfirmPassword" class="input-group-text bg-white/10 border-white/20 text-white btn btn-link text-decoration-none">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Password strength indicator -->
                <div class="mt-3">
                    <div class="d-flex justify-content-between small mb-1" style="color: var(--text-secondary);">
                        <span>Password Strength</span>
                        <span id="strengthText"></span>
                    </div>
                    <div class="w-100 bg-secondary rounded-3" style="height: 8px;">
                        <div id="strengthBar" class="h-100 rounded-3 transition-all duration-300 bg-secondary" style="width: 0%;"></div>
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="btn btn-gradient w-100">
                        <span id="buttonText">Reset Password</span>
                    </button>
                </div>
            </form>

            <div class="text-center mt-3">
                <p class="small mb-0" style="color: var(--text-secondary);">
                    Remember your password? 
                    <a href="{% url 'accounts:login' %}" class="text-danger fw-medium text-decoration-none hover:opacity-75">
                        Sign in here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetPasswordForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const buttonText = document.getElementById('buttonText');
    const originalButtonText = buttonText.textContent;
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    // Get email from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    
    if (!email) {
        // Redirect to forgot password if no email
        window.location.href = '{% url "forgot_password" %}';
    }

    // Toggle password visibility
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        const icon = this.querySelector('i');
        if (type === 'password') {
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        } else {
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        }
    });

    toggleConfirmPassword.addEventListener('click', function() {
        const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordInput.setAttribute('type', type);
        
        const icon = this.querySelector('i');
        if (type === 'password') {
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        } else {
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        }
    });

    // Password strength checker
    function checkPasswordStrength(password) {
        let strength = 0;
        let feedback = [];
        
        // Length check
        if (password.length >= 8) {
            strength += 25;
        } else {
            feedback.push('At least 8 characters');
        }
        
        // Lowercase letter
        if (/[a-z]/.test(password)) {
            strength += 15;
        } else {
            feedback.push('Lowercase letter');
        }
        
        // Uppercase letter
        if (/[A-Z]/.test(password)) {
            strength += 15;
        } else {
            feedback.push('Uppercase letter');
        }
        
        // Number
        if (/\d/.test(password)) {
            strength += 15;
        } else {
            feedback.push('Number');
        }
        
        // Special character
        if (/[^A-Za-z0-9]/.test(password)) {
            strength += 30;
        } else {
            feedback.push('Special character');
        }
        
        // Return strength level and color
        if (strength < 40) {
            return { level: 'Weak', color: 'bg-danger', width: '25%', text: 'Weak' };
        } else if (strength < 70) {
            return { level: 'Medium', color: 'bg-warning', width: '50%', text: 'Medium' };
        } else if (strength < 90) {
            return { level: 'Strong', color: 'bg-info', width: '75%', text: 'Strong' };
        } else {
            return { level: 'Very Strong', color: 'bg-success', width: '100%', text: 'Very Strong' };
        }
    }

    // Update password strength indicator
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        const strength = checkPasswordStrength(password);
        
        strengthBar.className = `h-100 rounded-3 transition-all duration-300 ${strength.color}`;
        strengthBar.style.width = strength.width;
        strengthText.textContent = strength.text;
        
        // Clear validation on typing
        this.classList.remove('is-invalid');
        confirmPasswordInput.classList.remove('is-invalid');
    });

    // Validate form
    function validateForm() {
        let isValid = true;
        
        // Clear previous errors
        passwordInput.classList.remove('is-invalid');
        confirmPasswordInput.classList.remove('is-invalid');
        
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        // Password validation
        if (!password) {
            showError('Please enter a password');
            passwordInput.classList.add('is-invalid');
            isValid = false;
        } else if (password.length < 8) {
            showError('Password must be at least 8 characters long');
            passwordInput.classList.add('is-invalid');
            isValid = false;
        } else if (password !== confirmPassword) {
            showError('Passwords do not match');
            confirmPasswordInput.classList.add('is-invalid');
            isValid = false;
        }
        
        return isValid;
    }

    function showError(message) {
        hideAllMessages();
        const errorMsg = document.createElement('div');
        errorMsg.className = 'mt-3 p-3 alert alert-danger rounded-3 text-center small';
        errorMsg.innerHTML = message;
        errorMsg.id = 'errorMessage';
        form.parentNode.insertBefore(errorMsg, form.nextSibling);
        
        // Auto-remove error after 5 seconds
        setTimeout(() => {
            if (errorMsg.parentNode) {
                errorMsg.remove();
            }
        }, 5000);
    }

    function showSuccess(message) {
        hideAllMessages();
        const successMsg = document.createElement('div');
        successMsg.className = 'mt-3 p-3 alert alert-success rounded-3 text-center small';
        successMsg.innerHTML = message;
        successMsg.id = 'successMessage';
        form.parentNode.insertBefore(successMsg, form.nextSibling);
        
        // Auto-remove success after 5 seconds
        setTimeout(() => {
            if (successMsg.parentNode) {
                successMsg.remove();
            }
        }, 5000);
    }

    function hideAllMessages() {
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        if (errorMsg) errorMsg.remove();
        if (successMsg) successMsg.remove();
    }

    function setButtonLoading(isLoading) {
        const button = form.querySelector('button[type="submit"]');
        if (isLoading) {
            buttonText.textContent = 'Resetting...';
            button.disabled = true;
        } else {
            buttonText.textContent = originalButtonText;
            button.disabled = false;
        }
    }

    // Form submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!validateForm()) {
            return;
        }

        setButtonLoading(true);
        
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

        const formData = new FormData();
        formData.append('email', email);
        formData.append('new_password', passwordInput.value);
        if (csrfToken) {
            formData.append('csrfmiddlewaretoken', csrfToken);
        }

        try {
            const response = await fetch('/accounts/api/reset-password/', {
                method: 'POST',
                body: formData,
                headers: csrfToken ? { 'X-CSRFToken': csrfToken } : {}
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('Password reset successfully! Redirecting to login...');
                // Redirect to login page after 3 seconds
                setTimeout(() => {
                    window.location.href = '{% url "login-page" %}';
                }, 3000);
            } else {
                showError(data.error || 'Failed to reset password. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            showError('Network error. Please try again.');
        } finally {
            setButtonLoading(false);
        }
    });

    // Real-time validation
    passwordInput.addEventListener('input', function() {
        if (this.value.length >= 8) {
            this.classList.remove('is-invalid');
        }
    });

    confirmPasswordInput.addEventListener('input', function() {
        if (this.value === passwordInput.value) {
            this.classList.remove('is-invalid');
        }
    });

    // Initialize AOS
    if (typeof AOS !== 'undefined') {
        AOS.init({
            duration: 800,
            easing: 'ease-out-cubic',
            once: true
        });
    }
});
</script>
{% endblock %}
