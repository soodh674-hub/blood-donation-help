{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - BloodLife{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-red-900/10 to-gray-900 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8">
        <div class="text-center">
            <div class="mx-auto h-16 w-16 bg-gradient-to-r from-red-500 to-red-600 rounded-full flex items-center justify-center mb-4">
                <svg class="h-8 w-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
            </div>
            <h2 class="mt-6 text-3xl font-extrabold text-white">
                Set new password
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Create a strong password for your account
            </p>
        </div>

        <div class="bg-white/5 backdrop-blur-lg rounded-2xl p-8 border border-white/10 shadow-2xl">
            <form id="resetPasswordForm" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">New Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required
                            class="block w-full pl-10 pr-10 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-200"
                            placeholder="Enter new password"
                        >
                        <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg class="h-5 w-5 text-gray-400 hover:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                            </svg>
                        </div>
                        <input 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            type="password" 
                            required
                            class="block w-full pl-10 pr-10 py-3 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition-all duration-200"
                            placeholder="Confirm new password"
                        >
                        <button type="button" id="toggleConfirmPassword" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <svg class="h-5 w-5 text-gray-400 hover:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Password strength indicator -->
                <div class="mt-2">
                    <div class="flex justify-between text-xs text-gray-400 mb-1">
                        <span>Password Strength</span>
                        <span id="strengthText"></span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-2">
                        <div id="strengthBar" class="bg-gray-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <div>
                    <button type="submit" 
                            class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 transition-all duration-200 transform hover:scale-105">
                        <span id="buttonText">Reset Password</span>
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-400">
                    Remember your password? 
                    <a href="{% url 'login-page' %}" class="font-medium text-red-400 hover:text-red-300 transition-colors">
                        Sign in here
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetPasswordForm');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
    const buttonText = document.getElementById('buttonText');
    const originalButtonText = buttonText.textContent;
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    // Get email from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const email = urlParams.get('email');
    
    if (!email) {
        // Redirect to forgot password if no email
        window.location.href = '{% url "forgot_password" %}';
    }

    // Toggle password visibility
    togglePassword.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        const icon = this.querySelector('svg');
        if (type === 'password') {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        } else {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
        }
    });

    toggleConfirmPassword.addEventListener('click', function() {
        const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPasswordInput.setAttribute('type', type);
        
        const icon = this.querySelector('svg');
        if (type === 'password') {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
        } else {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>';
        }
    });

    // Password strength checker
    function checkPasswordStrength(password) {
        let strength = 0;
        let feedback = [];
        
        // Length check
        if (password.length >= 8) {
            strength += 25;
        } else {
            feedback.push('At least 8 characters');
        }
        
        // Lowercase letter
        if (/[a-z]/.test(password)) {
            strength += 15;
        } else {
            feedback.push('Lowercase letter');
        }
        
        // Uppercase letter
        if (/[A-Z]/.test(password)) {
            strength += 15;
        } else {
            feedback.push('Uppercase letter');
        }
        
        // Number
        if (/\d/.test(password)) {
            strength += 15;
        } else {
            feedback.push('Number');
        }
        
        // Special character
        if (/[^A-Za-z0-9]/.test(password)) {
            strength += 30;
        } else {
            feedback.push('Special character');
        }
        
        // Return strength level and color
        if (strength < 40) {
            return { level: 'Weak', color: 'bg-red-500', width: '25%', text: 'Weak' };
        } else if (strength < 70) {
            return { level: 'Medium', color: 'bg-yellow-500', width: '50%', text: 'Medium' };
        } else if (strength < 90) {
            return { level: 'Strong', color: 'bg-blue-500', width: '75%', text: 'Strong' };
        } else {
            return { level: 'Very Strong', color: 'bg-green-500', width: '100%', text: 'Very Strong' };
        }
    }

    // Update password strength indicator
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        const strength = checkPasswordStrength(password);
        
        strengthBar.className = `h-2 rounded-full transition-all duration-300 ${strength.color}`;
        strengthBar.style.width = strength.width;
        strengthText.textContent = strength.text;
        
        // Clear validation on typing
        this.classList.remove('border-red-500');
        confirmPasswordInput.classList.remove('border-red-500');
    });

    // Validate form
    function validateForm() {
        let isValid = true;
        
        // Clear previous errors
        passwordInput.classList.remove('border-red-500');
        confirmPasswordInput.classList.remove('border-red-500');
        
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        // Password validation
        if (!password) {
            showError('Please enter a password');
            passwordInput.classList.add('border-red-500');
            isValid = false;
        } else if (password.length < 8) {
            showError('Password must be at least 8 characters long');
            passwordInput.classList.add('border-red-500');
            isValid = false;
        } else if (password !== confirmPassword) {
            showError('Passwords do not match');
            confirmPasswordInput.classList.add('border-red-500');
            isValid = false;
        }
        
        return isValid;
    }

    function showError(message) {
        hideAllMessages();
        const errorMsg = document.createElement('div');
        errorMsg.className = 'mt-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm text-center';
        errorMsg.innerHTML = message;
        errorMsg.id = 'errorMessage';
        form.parentNode.insertBefore(errorMsg, form.nextSibling);
        
        // Auto-remove error after 5 seconds
        setTimeout(() => {
            if (errorMsg.parentNode) {
                errorMsg.remove();
            }
        }, 5000);
    }

    function showSuccess(message) {
        hideAllMessages();
        const successMsg = document.createElement('div');
        successMsg.className = 'mt-4 p-3 bg-green-500/20 border border-green-500/50 rounded-lg text-green-300 text-sm text-center';
        successMsg.innerHTML = message;
        successMsg.id = 'successMessage';
        form.parentNode.insertBefore(successMsg, form.nextSibling);
        
        // Auto-remove success after 5 seconds
        setTimeout(() => {
            if (successMsg.parentNode) {
                successMsg.remove();
            }
        }, 5000);
    }

    function hideAllMessages() {
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        if (errorMsg) errorMsg.remove();
        if (successMsg) successMsg.remove();
    }

    function setButtonLoading(isLoading) {
        const button = form.querySelector('button[type="submit"]');
        if (isLoading) {
            buttonText.textContent = 'Resetting...';
            button.disabled = true;
        } else {
            buttonText.textContent = originalButtonText;
            button.disabled = false;
        }
    }

    // Form submission
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        if (!validateForm()) {
            return;
        }

        setButtonLoading(true);
        
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';

        const formData = new FormData();
        formData.append('email', email);
        formData.append('new_password', passwordInput.value);
        if (csrfToken) {
            formData.append('csrfmiddlewaretoken', csrfToken);
        }

        try {
            const response = await fetch('/accounts/api/reset-password/', {
                method: 'POST',
                body: formData,
                headers: csrfToken ? { 'X-CSRFToken': csrfToken } : {}
            });

            const data = await response.json();

            if (response.ok) {
                showSuccess('Password reset successfully! Redirecting to login...');
                // Redirect to login page after 3 seconds
                setTimeout(() => {
                    window.location.href = '{% url "login-page" %}';
                }, 3000);
            } else {
                showError(data.error || 'Failed to reset password. Please try again.');
            }
        } catch (error) {
            console.error('Error:', error);
            showError('Network error. Please try again.');
        } finally {
            setButtonLoading(false);
        }
    });

    // Real-time validation
    passwordInput.addEventListener('input', function() {
        if (this.value.length >= 8) {
            this.classList.remove('border-red-500');
        }
    });

    confirmPasswordInput.addEventListener('input', function() {
        if (this.value === passwordInput.value) {
            this.classList.remove('border-red-500');
        }
    });
});
</script>
{% endblock %}
